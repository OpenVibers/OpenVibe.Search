## ═══════════════════════════════════════════════════════════════
## search.openvibe.network — Nginx Configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/search.openvibe.network.conf — keep them in sync,
## and reload nginx after changing it. Install: README "Public host".
##
## The Node service (port 4710, systemd unit openvibe-search) serves:
##   /                                the search page (HTML for browsers, a text route index
##                                    otherwise) and /robots.txt. Public, no-store, result pages noindex.
##   /api/v1/search, /api/v1/suggest, GET /api/v1/documents/...   public query API (anonymous =
##                                    public documents only; the ov_token cookie or a Bearer adds
##                                    the caller's ACL matches). Responses are Cache-Control: no-store.
##   /api/v1/saved-searches[/...]     a signed-in person's saved searches (Network user token)
##   /api/v1/documents (PUT/DELETE), /api/v1/owners/...   owner API (service tokens): loopback only.
##                                    Services on this host call 127.0.0.1:4710 directly.
##   /internal/events                 OpenVibe.Events deliveries: loopback only.
##   /api/health, /api/ready, /release.json
##   /metrics                         Prometheus text, answered only to direct loopback callers
##                                    (never proxied; Node refuses a request carrying X-Forwarded-For)
## Everything else is a JSON 404 from nginx, so the name never falls through to another site.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovsearch_query:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ovsearch_saved:10m rate=2r/s;

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name search.openvibe.network;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://search.openvibe.network$request_uri; }
}

# ── HTTPS server ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name search.openvibe.network;

    # The host has the openvibe.network wildcard certificate, not a per-name one.
    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/search.openvibe.network.access.log;
    error_log  /var/log/nginx/search.openvibe.network.error.log;

    client_max_body_size 256k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client address only from $remote_addr (realip has already replaced it with the visitor's
    # address for Cloudflare's ranges); never append to or pass through a client-sent header.
    # Inherited by every location below that proxies (none sets its own).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/health   { proxy_pass http://127.0.0.1:4710; }
    location = /api/ready    { proxy_pass http://127.0.0.1:4710; }
    location = /release.json { proxy_pass http://127.0.0.1:4710; }

    # Metrics are for host-local scrapers only (http://127.0.0.1:4710/metrics).
    location = /metrics { return 404; }

    # ── Search page ─────────────────────────────────────────
    location = / {
        limit_except GET { deny all; }
        limit_req zone=ovsearch_query burst=40 nodelay;
        proxy_pass http://127.0.0.1:4710;
    }
    location = /robots.txt { proxy_pass http://127.0.0.1:4710; }

    # ── Public query API (GET only) ─────────────────────────
    location ~ ^/api/v1/(search|suggest)$ {
        limit_except GET { deny all; }
        limit_req zone=ovsearch_query burst=40 nodelay;
        proxy_pass http://127.0.0.1:4710;
        # Never let a shared cache hold a personalised answer.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # One document by id: GET is public (ACL-checked by Search); PUT/DELETE are owner writes,
    # loopback only.
    location ^~ /api/v1/documents/ {
        limit_except GET {
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }
        limit_req zone=ovsearch_query burst=40 nodelay;
        proxy_pass http://127.0.0.1:4710;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ── Saved searches (a Network user token; Search checks Origin for cookie changes) ──
    location ~ ^/api/v1/saved-searches(/|$) {
        limit_except GET POST DELETE { deny all; }
        limit_req zone=ovsearch_saved burst=20 nodelay;
        proxy_pass http://127.0.0.1:4710;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ── Loopback only: owner API and the Events webhook ─────
    location ^~ /api/v1/owners/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:4710;
    }
    location ^~ /internal/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:4710;
    }

    # ── Anything else: an honest JSON 404, never another site ──
    location / {
        default_type application/problem+json;
        return 404 '{"type":"about:blank","title":"Not Found","status":404,"code":"search.not_found","detail":"No such route on search.openvibe.network. The search page is at /, the public query API at /api/v1/search; see https://github.com/OpenVibers/OpenVibe.Search"}';
    }
}
