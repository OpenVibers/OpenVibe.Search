## ═══════════════════════════════════════════════════════════════
## search.openvibe.network — Nginx Configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/search.openvibe.network.conf — keep them in sync,
## and reload nginx after changing it.
##
## The Node service (port 4710, systemd unit openvibe-search) serves:
##   /api/v1/search, /api/v1/suggest, GET /api/v1/documents/...   public query API (anonymous =
##                                    public documents only; the ov_token cookie or a Bearer adds
##                                    the caller's ACL matches). Responses are Cache-Control: no-store.
##   /api/v1/documents (PUT/DELETE), /api/v1/owners/...   owner API (service tokens). Services on
##                                    this host call 127.0.0.1:4710, so the public vhost refuses
##                                    writes; open them only for an off-host owner.
##   /internal/events                 OpenVibe.Events deliveries — host-local only.
##   /api/health, /api/ready
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovsearch_query:10m rate=10r/s;

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name search.openvibe.network;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://search.openvibe.network$request_uri; }
}

# ── HTTPS server ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name search.openvibe.network;

    # The host has the openvibe.network wildcard certificate, not a per-name one.
    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/search.openvibe.network.access.log;
    error_log  /var/log/nginx/search.openvibe.network.error.log;

    client_max_body_size 256k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/health { proxy_pass http://127.0.0.1:4710; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location = /api/ready  { proxy_pass http://127.0.0.1:4710; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }

    # ── Public query API (GET only) ─────────────────────────
    location ~ ^/api/v1/(search|suggest|documents/) {
        limit_except GET { deny all; }
        limit_req zone=ovsearch_query burst=40 nodelay;
        proxy_pass http://127.0.0.1:4710;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never let a shared cache hold a personalised answer.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ── Owner API and the Events webhook: host-local only ───
    location /api/ { return 403; }
    location /internal/ { return 403; }

    location = / {
        proxy_pass http://127.0.0.1:4710;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
